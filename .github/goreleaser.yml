version: 2
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: 386
archives:
  - formats:
      - gz
    files:
      - none*
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64

  - image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64

  - image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv7"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v7"
    goarch: arm
    goarm: "7"

  - image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv6"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v6"
    goarch: arm
    goarm: "6"

  - image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-386"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/386"
    goarch: 386

docker_manifests:
  - name_template: "ghcr.io/jpillora/dynflare:{{ .Tag }}"
    image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-amd64"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-arm64"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv7"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv6"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-386"

  - name_template: "ghcr.io/jpillora/dynflare:latest"
    image_templates:
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-amd64"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-arm64"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv7"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-armv6"
      - "ghcr.io/jpillora/dynflare:{{ .Tag }}-386"
